<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>答岸（原岸上见）</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2e5bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/static/icon.svg">
<style>
:root{--p:#2e5bff;--bg:#f5f6fa;--card:#fff;--txt:#1f2430;--muted:#8a90a0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:70px}
header{background:var(--p);color:#fff;padding:14px 16px;font-size:17px;font-weight:600;position:sticky;top:0;z-index:5}
.page{padding:14px;display:none}.page.active{display:block}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:16px;font-weight:600}
.btn:disabled{opacity:.5}
.btn.ghost{background:#eef2ff;color:var(--p)}
textarea{width:100%;min-height:90px;border:1px solid #dde1ea;border-radius:10px;padding:10px;font-size:15px;resize:vertical}
input[type=text]{width:100%;border:1px solid #dde1ea;border-radius:10px;padding:10px;font-size:15px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 6px}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e6e8ef;z-index:5}
.tabbar button{flex:1;padding:10px 0 12px;border:0;background:none;font-size:12px;color:var(--muted)}
.tabbar button.on{color:var(--p);font-weight:600}
.tabbar .ico{font-size:20px;display:block;margin-bottom:2px}
#preview{max-width:100%;border-radius:10px;margin-top:8px;display:none}
.tag{display:inline-block;background:#eef2ff;color:var(--p);border-radius:6px;padding:2px 8px;font-size:12px;margin-right:6px}
.md h2{font-size:16px;margin:14px 0 6px;color:var(--p)}
.md h3{font-size:15px;margin:10px 0 4px}
.md p,.md li{font-size:15px;line-height:1.65;margin:4px 0}
.md ul,.md ol{padding-left:20px}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid #e0e3ec;padding:5px 8px}
.md code{background:#f0f2f8;border-radius:4px;padding:1px 5px;font-size:13px}
.md strong{color:#d14}
.mistake{border-left:3px solid var(--p)}
.card.folded>*:not(:first-child){display:none}
.card.hist{opacity:.85}
.mistake .q{font-size:14px;line-height:1.5;max-height:66px;overflow:hidden}
.mistake .meta{font-size:12px;color:var(--muted);margin-top:6px}
.spin{text-align:center;color:var(--muted);padding:20px;font-size:14px}
.bar{background:#eef2ff;border-radius:6px;height:18px;position:relative;margin:4px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--p);border-radius:6px}
.bar span{position:relative;font-size:12px;padding-left:8px;line-height:18px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.del{background:none;border:0;color:#c33;font-size:12px;float:right;margin-left:10px;padding:2px 4px}
</style>
</head>
<body>
<header>答岸 · 花生十三方法</header>

<div class="page active" id="page-ask">
  <div class="card">
    <label>① 上传错题截图 / 拍照（或在下方粘贴题目文字）</label>
    <div class="row">
      <button class="btn ghost" onclick="document.getElementById('file').click()">📷 选择图片</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview">
    <label>② 题目文字（可选，与图片二选一）</label>
    <textarea id="qtext" placeholder="粘贴题干和选项…"></textarea>
    <label>③ 你选的答案（可选，填了会帮你分析错因）</label>
    <input type="text" id="uanswer" placeholder="如：A" maxlength="10">
    <div style="height:12px"></div>
    <button class="btn" id="go" onclick="explain()">用花生十三方法讲解</button>
  </div>
  <div id="result"></div>
</div>

<div class="page" id="page-book"><div id="book"></div></div>
<div class="page" id="page-stats"><div id="stats"></div></div>

<div class="tabbar">
  <button class="on" data-p="ask"><span class="ico">✏️</span>拍题讲解</button>
  <button data-p="book"><span class="ico">📒</span>错题本</button>
  <button data-p="stats"><span class="ico">📊</span>薄弱分析</button>
</div>

<script>
let lastResult=null;
const $=id=>document.getElementById(id);
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+b.dataset.p).classList.add('active');
  if(b.dataset.p==='book')loadBook();
  if(b.dataset.p==='stats')loadStats();
});
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(f);
};
function md(s){
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const lines=s.split('\n');let out='',inUl=0,inOl=0,inTable=0;
  const close=()=>{if(inUl){out+='</ul>';inUl=0}if(inOl){out+='</ol>';inOl=0}if(inTable){out+='</table>';inTable=0}};
  for(let l of lines){
    if(/^\s*\|/.test(l)){if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;
      if(!inTable){close();out+='<table>';inTable=1}
      out+='<tr>'+l.replace(/^\s*\||\|\s*$/g,'').split('|').map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';continue}
    if(inTable){out+='</table>';inTable=0}
    if(/^###\s/.test(l)){close();out+='<h3>'+inline(l.slice(4))+'</h3>'}
    else if(/^##\s/.test(l)){close();out+='<h2>'+inline(l.slice(3))+'</h2>'}
    else if(/^#\s/.test(l)){close();out+='<h2>'+inline(l.slice(2))+'</h2>'}
    else if(/^\s*[-*]\s/.test(l)){if(!inUl){close();out+='<ul>';inUl=1}out+='<li>'+inline(l.replace(/^\s*[-*]\s/,''))+'</li>'}
    else if(/^\s*\d+[.、]\s/.test(l)){if(!inOl){close();out+='<ol>';inOl=1}out+='<li>'+inline(l.replace(/^\s*\d+[.、]\s/,''))+'</li>'}
    else if(l.trim()===''){close()}
    else{close();out+='<p>'+inline(l)+'</p>'}
  }
  close();return out;
}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}
async function explain(){
  const f=$('file').files[0],t=$('qtext').value.trim();
  if(!f&&!t){alert('请上传图片或粘贴题目文字');return}
  $('go').disabled=true;
  let secs=0;
  document.getElementById('loading')?.remove();
  $('result').insertAdjacentHTML('afterbegin','<div class="card spin" id="loading">⏳ AI 识题中…（0秒）</div>');
  const timer=setInterval(()=>{secs++;const el=$('loading');if(!el){clearInterval(timer);return}
    el.textContent=secs<8?'⏳ AI 识题中…（'+secs+'秒）':secs<25?'🧭 已识题，正在匹配花生十三方法…（'+secs+'秒）':'✍️ 正在生成分步讲解，马上好…（'+secs+'秒）'},1000);
  const fd=new FormData();
  if(f)fd.append('image',f);
  if(t)fd.append('text',t);
  const ua=$('uanswer').value.trim();if(ua)fd.append('user_answer',ua);
  try{
    saved=false;
    const r=await fetch('/api/explain',{method:'POST',body:fd});
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();lastResult=d;
    document.getElementById('loading')?.remove();
    document.querySelectorAll('#result .simbox').forEach(x=>x.removeAttribute('id'));
    document.querySelectorAll('#result > .card').forEach(c=>{if(!c.classList.contains('hist')){c.classList.add('hist');
      c.insertAdjacentHTML('afterbegin','<div style="font-size:12px;color:var(--muted);margin-bottom:6px" onclick="event.stopPropagation();const b=this.parentElement;b.classList.toggle(\'folded\')">🕓 历史讲解（点此展开/折叠）</div>');
      c.classList.add('folded')}});
    $('result').insertAdjacentHTML('afterbegin','<div class="card"><span class="tag">'+(d.module_name||'')+'</span><span class="tag">'+(d.question_type||'')+'</span>'
      +'<div class="md">'+md(d.explanation)+'</div>'
      +'<div style="height:10px"></div><div class="row"><button class="btn ghost" onclick="saveMistake(this)">存入错题本</button>'
      +'<button class="btn ghost" onclick="similar(this)">举一反三</button></div><div class="simbox" id="simbox"></div></div>');
  }catch(e){document.getElementById('loading')?.remove();$('result').insertAdjacentHTML('afterbegin','<div class="card" style="color:#c33">失败：'+e.message+'，请重试</div>')}
  clearInterval(timer);
  $('go').disabled=false;
}
let saved=false;
async function saveMistake(btn){
  if(!lastResult||saved)return;
  const d=lastResult;
  await fetch('/api/mistakes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    module:d.module,question_type:d.question_type,question_text:d.question_text,
    user_answer:d.user_answer,explanation:d.explanation})});
  saved=true;
  if(btn){btn.textContent='✓ 已存入错题本';btn.disabled=true}
}
async function similar(btn){
  btn.disabled=true;let ss=0;btn.textContent='出题中…（0秒）';
  const st=setInterval(()=>{ss++;btn.textContent='出题中…（'+ss+'秒）'},1000);
  try{
    const r=await fetch('/api/similar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question_text:lastResult.question_text,question_type:lastResult.question_type})});
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const d=await r.json();
    const parts=d.content.split('<!--answer-->');
    window._simQ=parts[0];
    const m=(parts[1]||'').match(/答案[：:\s\*]*([A-D])/);
    window._simCorrect=m?m[1]:null;
    $('simbox').innerHTML='<hr style="border:0;border-top:1px dashed #dde;margin:12px 0">'
      +'<div class="md">'+md(parts[0])+'</div>'
      +'<div style="margin:8px 0"><label>先选你的答案再看解析：</label><div class="row" id="simopts">'
      +['A','B','C','D'].map(o=>'<button class="btn ghost" onclick="pickSim(this,\''+o+'\')">'+o+'</button>').join('')+'</div></div>'
      +(parts[1]?'<div id="simans" style="display:none"><div class="md">'+md(parts[1])+'</div>'
      +'<button class="btn ghost" onclick="explainSim()">用花生十三方法详解这道题</button></div>':'');
  }catch(e){$('simbox').innerHTML='<p style="color:#c33;font-size:14px">出题失败：'+e.message+'</p>'}
  clearInterval(st);btn.disabled=false;btn.textContent='举一反三';
}
function pickSim(btn,opt){
  window._simUA=opt;
  document.querySelectorAll('#simopts .btn').forEach(b=>{
    b.disabled=true;b.style.opacity=b===btn?'1':'.4';
    if(window._simCorrect){
      if(b.textContent===window._simCorrect){b.style.background='#2eaf62';b.style.color='#fff';b.style.opacity='1'}
      else if(b===btn){b.style.background='#d64545';b.style.color='#fff'}
    }});
  $('simans').style.display='block';
}
function explainSim(){
  $('qtext').value=(window._simQ||'').replace(/^##\s*练习题\s*/,'').replace(/##\s*提示[\s\S]*$/,'').trim();
  $('uanswer').value=window._simUA||'';
  $('file').value='';$('preview').style.display='none';
  window.scrollTo(0,0);explain();
}
async function loadBook(){
  $('book').innerHTML='<div class="spin">加载中…</div>';
  const d=await(await fetch('/api/mistakes')).json();
  bookCache=d.items;
  if(!d.items.length){$('book').innerHTML='<div class="card spin">错题本还是空的</div>';return}
  $('book').innerHTML=d.items.map(m=>'<div class="card mistake" onclick="toggle(this)">'
    +'<button class="del" onclick="event.stopPropagation();delM('+m.id+')">删除</button>'
    +'<button class="del" style="color:var(--p)" onclick="event.stopPropagation();redo('+m.id+')">重做</button>'
    +'<span class="tag">'+(m.question_type||m.module||'')+'</span>'
    +'<div class="q">'+(m.question_text||'').slice(0,120)+'</div>'
    +'<div class="meta">'+new Date(m.created_at*1000).toLocaleString('zh-CN')+'</div>'
    +'<div class="md" style="display:none">'+md(m.explanation||'')+'</div></div>').join('');
}
function toggle(el){const m=el.querySelector('.md');m.style.display=m.style.display==='none'?'block':'none';
  el.querySelector('.q').style.maxHeight=m.style.display==='none'?'66px':'none'}
let bookCache=[];
function redo(id){
  const m=bookCache.find(x=>x.id===id);if(!m)return;
  $('qtext').value=m.question_text||'';$('uanswer').value='';
  $('file').value='';$('preview').style.display='none';
  document.querySelector('.tabbar button[data-p=ask]').click();
  window.scrollTo(0,0);
  alert('题目已填入，先自己做一遍、填上答案再点讲解');
}
async function delM(id){if(!confirm('确定删除这道错题？'))return;await fetch('/api/mistakes/'+id,{method:'DELETE'});loadBook()}
async function loadStats(){
  const d=await(await fetch('/api/stats')).json();
  const total=d.by_module.reduce((s,m)=>s+m.n,0)||1;
  $('stats').innerHTML='<div class="card"><h3 style="margin-bottom:8px">错题模块分布</h3>'
    +(d.by_module.length?d.by_module.map(m=>'<div class="bar"><i style="width:'+(m.n/total*100)+'%"></i><span>'+(m.module||'未知')+' × '+m.n+'</span></div>').join(''):'<div class="spin">暂无数据</div>')
    +'</div><div class="card"><h3 style="margin-bottom:8px">高频错题型 TOP10</h3>'
    +(d.by_type.length?d.by_type.map(m=>'<p style="font-size:14px;margin:4px 0">'+(m.question_type||'未知')+' <b style="color:var(--p)">×'+m.n+'</b></p>').join(''):'<div class="spin">暂无数据</div>')
    +'</div>';
}
</script>
</body>
</html>
