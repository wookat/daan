services:
  kaogong:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    restart: unless-stopped
    # 共享宿主 CPU 争抢时的相对调度权重（默认 1024），空闲时无影响
    cpu_shares: 4096
    # memswap_limit == mem_limit → cgroup memory.swap.max=0：进程页固定在 RAM，不再被整体换出
    # 后每个请求回页 25s+；mem_reservation → memory.low，宿主回收时优先保住工作集。
    # 匿名内存真超上限时 OOM kill（OOMKilled=true）并由 restart 秒级拉起，替代 5 分钟假死判定。
    mem_limit: 768m
    memswap_limit: 768m
    mem_reservation: 384m
    ports:
      - "127.0.0.1:8300:8000"
    environment:
      - TZ=Asia/Shanghai
      - DISABLE_API_DOCS=${DISABLE_API_DOCS:-1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.5}
      - LLM_TEXT_BASE_URL=${LLM_TEXT_BASE_URL:-}
      - LLM_TEXT_API_KEY=${LLM_TEXT_API_KEY:-}
      - LLM_TEXT_MODEL=${LLM_TEXT_MODEL:-}
      - LLM_RESCUE_BASE_URL=${LLM_RESCUE_BASE_URL:-}
      - LLM_RESCUE_API_KEY=${LLM_RESCUE_API_KEY:-}
      - LLM_RESCUE_MODEL=${LLM_RESCUE_MODEL:-deepseek-chat}
      - ACCESS_CODE=${ACCESS_CODE}
      - IMPORT_TOKEN=${IMPORT_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - MONITOR_URL=${MONITOR_URL:-}
      - MONITOR_KEY=${MONITOR_KEY:-}
      - KG_VAPID_PRIVATE=${KG_VAPID_PRIVATE:-}
      - KG_VAPID_PUBLIC=${KG_VAPID_PUBLIC:-}
      - KG_VAPID_SUB=${KG_VAPID_SUB:-mailto:support@zalize.com}
      # 探针出口网段（逗号分隔 CIDR）：命中的作答/埋点入库打 probe=1，运营看板剔除；空=不打标
      - KG_PROBE_CIDRS=${KG_PROBE_CIDRS:-}
    volumes:
      - kaogong-data:/data
      # 运维审计日志目录（部署/生命周期/备份巡检），只读供 /api/admin/ops_status 外显
      - /home/ubuntu/kaogong-reports:/reports:ro
    labels:
      - autoheal=true
    # 宿主级内存-IO 颠簸可致 uvicorn 假死（进程在、请求全挂），健康检查持续失败时由 autoheal 重启
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=20)"]
      interval: 60s
      timeout: 25s
      retries: 5
      start_period: 180s

  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  kaogong-data:
