name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt "ruff==0.15.20" pytest  # ruff 钉基线版本；pytest 不入生产 requirements
      - run: python -m ruff check .
      # main.py 启动时挂载 frontend-uni/dist/build/h5（无则回退 frontend/）；
      # API 测试不需要真实产物，只要求目录存在
      - run: mkdir -p ../frontend-uni/dist/build/h5
      - run: python -m pytest tests/ -q

  frontend:
    name: frontend (vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-uni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-uni/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run lint

  miniapp:
    name: miniapp (tsc + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miniapp-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
