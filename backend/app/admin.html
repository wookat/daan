<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>考公助手 · 管理后台</title>
<style>
:root { --brand:#4f46e5; --bad:#ef4444; --ok:#22c55e; --ink:#1f2430; --ink2:#6b7280; --line:#e5e7eb; --soft:#f4f5f9; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--soft); }
header { background:var(--brand); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; }
header input { border:none; border-radius:6px; padding:6px 10px; width:220px; }
main { max-width:1080px; margin:20px auto; padding:0 16px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
.card { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.card .n { font-size:22px; font-weight:700; }
.card .t { color:var(--ink2); font-size:12px; }
.tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.tab { padding:6px 16px; border-radius:999px; background:#fff; border:1px solid var(--line); cursor:pointer; }
.tab.on { background:var(--brand); color:#fff; border-color:var(--brand); }
.bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.bar input,.bar select { padding:6px 10px; border:1px solid var(--line); border-radius:6px; }
.bar button,.q button { padding:6px 14px; border:none; border-radius:6px; background:var(--brand); color:#fff; cursor:pointer; }
.q { background:#fff; border-radius:10px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.q .meta { color:var(--ink2); font-size:12px; margin-bottom:6px; display:flex; gap:10px; flex-wrap:wrap; }
.q .down { color:var(--bad); font-weight:600; }
.q pre { white-space:pre-wrap; background:var(--soft); border-radius:8px; padding:10px; font:13px/1.5 inherit; max-height:180px; overflow:auto; }
.q textarea { width:100%; min-height:80px; border:1px solid var(--line); border-radius:8px; padding:8px; font:13px/1.5 inherit; }
.q .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
.q button.warn { background:var(--bad); }
.q button.ok { background:var(--ok); }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:var(--soft); }
.empty { text-align:center; color:var(--ink2); padding:40px; }
.tbl { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:20px; }
.tbl th,.tbl td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:13px; }
.tbl th { background:var(--soft); color:var(--ink2); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>考公助手 · 管理后台</h1>
  <input id="token" type="password" placeholder="管理令牌" />
  <button class="tab" onclick="saveToken()">登录</button>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div id="llmhealth" style="margin:8px 0"></div>
  <div id="usage"></div>
  <div class="tabs">
    <div class="tab on" data-tab="flagged" onclick="switchTab(this)">解析质检（差评队列）</div>
    <div class="tab" data-tab="search" onclick="switchTab(this)">题库管理</div>
    <div class="tab" data-tab="cache" onclick="switchTab(this)">讲解缓存差评</div>
    <div class="tab" data-tab="disabled" onclick="switchTab(this)">已下架</div>
    <div class="tab" data-tab="papers" onclick="switchTab(this)">成套试卷</div>
    <div class="tab" data-tab="ann" onclick="switchTab(this)">运营公告</div>
    <div class="tab" data-tab="batches" onclick="switchTab(this)">批次审核</div>
    <div class="tab" data-tab="reports" onclick="switchTab(this)" id="tab-reports">纠错处理</div>
  </div>
  <div class="bar" id="searchbar" style="display:none">
    <input id="kw" placeholder="题干关键词" />
    <select id="mod">
      <option value="">全部模块</option>
      <option value="ziliao">资料分析</option>
      <option value="shuliang">数量关系</option>
      <option value="yanyu">言语理解</option>
      <option value="panduan">判断推理</option>
      <option value="changshi">常识判断</option>
    </select>
    <button onclick="load()">搜索</button>
  </div>
  <div class="bar" id="reportbar" style="display:none">
    <select id="rstatus" onchange="load()">
      <option value="open">待处理</option>
      <option value="fixed">已修复</option>
      <option value="rejected">已驳回</option>
    </select>
  </div>
  <div class="bar" id="annbar" style="display:none">
    <input id="annTitle" placeholder="公告标题（展示在用户端首页）" />
    <input id="annBody" placeholder="公告正文（可选）" style="flex:1" />
    <button onclick="createAnn()">发布</button>
  </div>
  <div id="list"><div class="empty">输入管理令牌后加载数据</div></div>
</main>
<script>
let TAB = 'flagged';
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem('admToken') || '';
function saveToken() { localStorage.setItem('admToken', $('token').value.trim()); boot(); }
function h(t) { return { 'X-Admin-Token': t ?? token(), 'Content-Type': 'application/json' }; }
async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: h() }, opt || {}));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
async function stats() {
  const s = await api('/api/admin/stats');
  const items = [
    ['总题数', s.total], ['真题', s.real], ['花生解析', s.hs_done],
    ['差评题目', s.hs_down_total], ['已下架', s.disabled],
    ['讲解缓存', s.cache_entries], ['缓存命中', s.cache_hits],
    ['缓存差评', s.cache_down], ['错题记录', s.mistakes],
  ];
  $('cards').innerHTML = items.map(([t, n]) => `<div class="card"><div class="n">${n}</div><div class="t">${t}</div></div>`).join('');
  const du = s.daily_usage || [];
  $('usage').innerHTML = du.length
    ? `<h3 style="margin:6px 0 8px">近 14 天使用趋势</h3>
       <table class="tbl"><thead><tr><th>日期</th><th>练习组数</th><th>答题量</th><th>整体正确率</th></tr></thead><tbody>${du.map(r => `<tr><td>${r.d}</td><td>${r.sessions}</td><td>${r.answered}</td><td>${r.acc == null ? '-' : r.acc + '%'}</td></tr>`).join('')}</tbody></table>`
    : '';
  llmHealth();
}
async function llmHealth() {
  const box = $('llmhealth');
  box.innerHTML = '<h3 style="margin:6px 0 8px">AI 通道状态</h3><span style="color:#888">检测中…</span>';
  try {
    const d = await api('/api/admin/llm_health');
    box.innerHTML = '<h3 style="margin:6px 0 8px">AI 通道状态</h3>' + (d.items || []).map((it) =>
      `<span class="badge" style="margin-right:8px;${it.ok ? 'background:#f0fdf4;color:#166534' : 'background:#fef2f2;color:#dc2626'}">${it.ok ? '●' : '✕'} ${esc(it.name)} ${esc(it.host)} (${esc(it.status)})</span>`).join('');
  } catch (e) {
    box.innerHTML = '<h3 style="margin:6px 0 8px">AI 通道状态</h3><span style="color:#dc2626">检测失败</span>';
  }
}
function switchTab(el) {
  document.querySelectorAll('.tab[data-tab]').forEach((t) => t.classList.remove('on'));
  el.classList.add('on');
  TAB = el.dataset.tab;
  $('searchbar').style.display = TAB === 'search' ? 'flex' : 'none';
  $('annbar').style.display = TAB === 'ann' ? 'flex' : 'none';
  $('reportbar').style.display = TAB === 'reports' ? 'flex' : 'none';
  load();
}
function qCard(q) {
  const opts = Object.entries(q.options || {}).map(([k, v]) => `${k}. ${esc(v)}`).join('<br>');
  return `<div class="q" id="q${q.id}">
    <div class="meta">
      <span>#${q.id}</span><span class="badge">${esc(q.module)}${q.submodule ? ' · ' + esc(q.submodule) : ''}</span>
      ${q.is_real ? `<span class="badge">真题 ${q.exam_year || ''} ${esc(q.exam_region || '')}</span>` : ''}
      <span>答案 <b>${esc(q.answer)}</b></span>
      ${q.hs_down ? `<span class="down">👎 ${q.hs_down}</span>` : ''}${q.hs_up ? `<span>👍 ${q.hs_up}</span>` : ''}
      ${q.disabled ? '<span class="down">已下架</span>' : ''}
    </div>
    <pre>${esc(q.question)}\n\n${opts}</pre>
    <details><summary>花生解析（点开编辑）</summary>
      <textarea id="hs${q.id}">${esc(q.hs_explanation || '')}</textarea>
      <div class="row">
        答案 <input id="ans${q.id}" value="${esc(q.answer)}" style="width:50px;padding:4px;border:1px solid var(--line);border-radius:6px" />
        <button class="ok" onclick="saveQ(${q.id})">保存修改</button>
      </div>
    </details>
    <div class="row">
      ${q.disabled
        ? `<button class="ok" onclick="patchQ(${q.id},{disabled:0})">恢复上架</button>`
        : `<button class="warn" onclick="patchQ(${q.id},{disabled:1})">下架此题</button>`}
      ${q.hs_down ? `<button onclick="patchQ(${q.id},{hs_explanation:''})">清空差评解析（待重产）</button>` : ''}
    </div>
  </div>`;
}
async function saveQ(id) {
  await patchQ(id, { hs_explanation: $('hs' + id).value, answer: $('ans' + id).value.trim() });
}
async function patchQ(id, body) {
  try {
    await api('/api/admin/questions/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    $('q' + id).style.opacity = 0.5;
    load();
  } catch (e) { alert('失败：' + e.message); }
}
async function delCache(key) {
  try { await api('/api/admin/cache/' + key, { method: 'DELETE' }); load(); } catch (e) { alert('失败：' + e.message); }
}
async function createAnn() {
  try {
    await api('/api/admin/announcements', { method: 'POST', body: JSON.stringify({ title: $('annTitle').value, body: $('annBody').value }) });
    $('annTitle').value = ''; $('annBody').value = ''; load();
  } catch (e) { alert('失败：' + e.message); }
}
async function toggleAnn(id, active) {
  try { await api('/api/admin/announcements/' + id, { method: 'PATCH', body: JSON.stringify({ active }) }); load(); } catch (e) { alert('失败：' + e.message); }
}
async function batchDecide(bid, approve) {
  if (!approve && !confirm('驳回将删除该批次待审题目，确定？')) return;
  try { await api('/api/admin/batches/' + bid + '/decide', { method: 'POST', body: JSON.stringify({ approve }) }); load(); } catch (e) { alert('失败：' + e.message); }
}
async function batchSample(bid) {
  try {
    const d = await api('/api/admin/batches/' + bid + '/sample');
    document.getElementById('bs' + bid).innerHTML = d.items.map((q) => `<pre>${esc(q.module)}｜答案 ${esc(q.answer)}｜${esc(q.question.slice(0, 200))}\n${Object.entries(q.options || {}).map(([k, v]) => k + '. ' + esc(String(v).slice(0, 80))).join('\n')}</pre>`).join('');
  } catch (e) { alert('失败：' + e.message); }
}
async function handleReport(id, status) {
  const note = status === 'open' ? '' : prompt(status === 'fixed' ? '处理备注（可选）：' : '驳回原因（可选）：') || '';
  try { await api('/api/admin/question_reports/' + id, { method: 'PATCH', body: JSON.stringify({ status, note: note || null }) }); load(); } catch (e) { alert('失败：' + e.message); }
}
async function saveReportQ(rid, qid) {
  const body = {
    answer: $('rq-ans' + rid).value.trim().toUpperCase(),
    module: $('rq-mod' + rid).value,
    submodule: $('rq-sub' + rid).value.trim(),
    explanation: $('rq-exp' + rid).value,
  };
  if (body.answer && !/^[A-D]$/.test(body.answer)) { alert('答案需为 A-D 单字母'); return; }
  try {
    await api('/api/admin/questions/' + qid, { method: 'PATCH', body: JSON.stringify(body) });
    alert('题目已更新，可继续标记已修复');
  } catch (e) { alert('失败：' + e.message); }
}
const MODS = { ziliao: '资料分析', shuliang: '数量关系', yanyu: '言语理解', panduan: '判断推理', changshi: '常识判断' };
function fmtOpts(s) {
  try {
    const o = JSON.parse(s || '{}');
    return Object.entries(o).map(([k, v]) => k + '. ' + String(v).slice(0, 60)).join('\n');
  } catch (e) { return ''; }
}
async function refreshReportBadge() {
  try {
    const d = await api('/api/admin/question_reports?status=open');
    const el = document.getElementById('tab-reports');
    if (el) el.textContent = d.open_count ? `纠错处理（${d.open_count}）` : '纠错处理';
  } catch (e) { /* ignore */ }
}
let LOADSEQ = 0;
async function load() {
  refreshReportBadge();
  const seq = ++LOADSEQ;
  const render = (html) => { if (seq === LOADSEQ) $('list').innerHTML = html; };
  try {
    if (TAB === 'reports') {
      const st = $('rstatus') ? $('rstatus').value : 'open';
      const d = await api('/api/admin/question_reports?status=' + st);
      render(d.items.length ? d.items.map((r) => `<div class="q">
        <div class="meta"><span>#${r.id}</span><span>${new Date(r.created_at * 1000).toLocaleString()}</span><span class="badge">${esc(r.reason)}</span>${r.uid ? `<span>用户 ${esc(r.uid.slice(0, 12))}</span>` : ''}${r.question_id ? `<span>题 #${r.question_id}（${esc(MODS[r.module] || r.module || '')}，答案 ${esc(r.answer || '')}）</span>` : ''}${r.disabled ? '<span class="down">题目已下架</span>' : ''}${r.handled_at ? `<span>处理于 ${new Date(r.handled_at * 1000).toLocaleString()}</span>` : ''}</div>
        <pre>${esc((r.question || '（题目不存在或已删除）').slice(0, 300))}</pre>
        ${r.detail ? `<pre>用户说明：${esc(r.detail.slice(0, 500))}</pre>` : ''}
        ${r.note ? `<pre>处理备注：${esc(r.note)}</pre>` : ''}
        ${r.question_id && r.question ? `<details><summary>查看完整题目 / 直接编辑</summary>
          <pre>${esc(r.question)}\n\n${esc(fmtOpts(r.options))}</pre>
          <div class="row">
            答案 <input id="rq-ans${r.id}" value="${esc(r.answer || '')}" style="width:50px;padding:4px;border:1px solid var(--line);border-radius:6px" />
            模块 <select id="rq-mod${r.id}">${Object.entries(MODS).map(([k, v]) => `<option value="${k}" ${r.module === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
            题型 <input id="rq-sub${r.id}" value="${esc(r.submodule || '')}" style="width:120px;padding:4px;border:1px solid var(--line);border-radius:6px" />
          </div>
          <div style="margin-top:8px;font-size:12px;color:var(--ink2)">解析</div>
          <textarea id="rq-exp${r.id}">${esc(r.explanation || '')}</textarea>
          <div class="row"><button class="ok" onclick="saveReportQ(${r.id},${r.question_id})">保存题目修改</button></div>
        </details>` : ''}
        <div class="row">
          ${r.question_id && !r.disabled ? `<button class="warn" onclick="patchQ(${r.question_id},{disabled:1})">下架此题</button>` : ''}
          ${st === 'open' ? `<button class="ok" onclick="handleReport(${r.id},'fixed')">标记已修复</button>
          <button onclick="handleReport(${r.id},'rejected')">驳回</button>` : `<button onclick="handleReport(${r.id},'open')">重新打开</button>`}
        </div>
      </div>`).join('') : '<div class="empty">暂无' + ($('rstatus').selectedOptions[0].textContent) + '的纠错</div>');
      return;
    }
    if (TAB === 'batches') {
      const d = await api('/api/admin/batches');
      render(d.items.length ? d.items.map((b) => `<div class="q">
        <div class="meta"><span class="badge">${esc(b.batch)}</span><span>共 ${b.n} 题</span><span>真题 ${b.real_n || 0}</span>${b.pending ? `<span class="down">待审 ${b.pending}</span>` : '<span>已全部发布</span>'}</div>
        <div class="row">
          <button onclick="batchSample('${esc(b.batch)}')">抽样 10 题</button>
          ${b.pending ? `<button class="ok" onclick="batchDecide('${esc(b.batch)}',true)">发布批次</button><button class="warn" onclick="batchDecide('${esc(b.batch)}',false)">驳回删除</button>` : ''}
        </div>
        <div id="bs${esc(b.batch)}"></div>
      </div>`).join('') : '<div class="empty">暂无导入批次（新导入将自动进入待审）</div>');
      return;
    }
    if (TAB === 'papers') {
      const d = await api('/api/admin/exam_papers');
      render(d.items.length ? `<table class="tbl"><thead><tr><th>ID</th><th>标题</th><th>类型</th><th>年份</th><th>地区</th><th>题量</th><th>时长</th><th>创建时间</th></tr></thead><tbody>${d.items.map((p) => `<tr><td>${p.id}</td><td>${esc(p.title)}</td><td>${esc(p.kind)}</td><td>${p.year || '-'}</td><td>${esc(p.region || '-')}</td><td>${p.n}</td><td>${p.duration_min} 分钟</td><td>${new Date(p.created_at * 1000).toLocaleString()}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">暂无成套试卷，在服务器上运行 backend/scripts/build_zhenti_papers.py 生成</div>');
      return;
    }
    if (TAB === 'ann') {
      const d = await api('/api/admin/announcements');
      render(d.items.length ? d.items.map((a) => `<div class="q">
        <div class="meta"><span>#${a.id}</span><span>${new Date(a.created_at * 1000).toLocaleString()}</span>${a.active ? '<span class="badge">展示中</span>' : '<span class="down">已下线</span>'}</div>
        <pre>${esc(a.title)}${a.body ? '\n' + esc(a.body) : ''}</pre>
        <div class="row">${a.active
          ? `<button class="warn" onclick="toggleAnn(${a.id},false)">下线</button>`
          : `<button class="ok" onclick="toggleAnn(${a.id},true)">重新上线</button>`}</div>
      </div>`).join('') : '<div class="empty">暂无公告，在上方发布</div>');
      return;
    }
    if (TAB === 'cache') {
      const d = await api('/api/admin/flagged_cache');
      render(d.items.length ? d.items.map((c) => `<div class="q">
        <div class="meta"><span class="badge">${esc(c.module || '')}</span><span>命中 ${c.hits}</span><span class="down">👎 ${c.down}</span><span>👍 ${c.up}</span></div>
        <pre>${esc((c.question_text || '').slice(0, 300))}</pre>
        <details><summary>查看解析</summary><pre>${esc(c.explanation)}</pre></details>
        <div class="row"><button class="warn" onclick="delCache('${c.key}')">删除此缓存（下次重新生成）</button></div>
      </div>`).join('') : '<div class="empty">暂无差评缓存</div>');
      return;
    }
    const p = new URLSearchParams();
    if (TAB === 'flagged') p.set('flagged', '1');
    if (TAB === 'disabled') p.set('disabled', '1');
    if (TAB === 'search') {
      if ($('kw').value.trim()) p.set('keyword', $('kw').value.trim());
      if ($('mod').value) p.set('module', $('mod').value);
    }
    const d = await api('/api/admin/questions?' + p);
    render(d.items.length ? d.items.map(qCard).join('') : '<div class="empty">暂无数据</div>');
  } catch (e) {
    render(`<div class="empty">加载失败：${esc(e.message)}（请检查管理令牌）</div>`);
  }
}
async function boot() { try { await stats(); await load(); } catch (e) { $('list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}（请检查管理令牌）</div>`; } }
if (token()) { $('token').value = token(); boot(); }
</script>
</body>
</html>
